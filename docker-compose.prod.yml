version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crm_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_password_change_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_user} -d ${POSTGRES_DB:-crm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKER_BACKEND_IMAGE:-smarteco/crm-backend:latest}
    container_name: smarteco_crm_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-crm_user}:${POSTGRES_PASSWORD:-crm_password_change_in_production}@postgres:5432/${POSTGRES_DB:-crm_db}
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:-change_this_to_a_random_secure_key}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-'["http://localhost"]'}
      BACKEND_CORS_ORIGIN_REGEX: ${BACKEND_CORS_ORIGIN_REGEX:-'^https?://.*'}
    expose:
      - "8000"

  frontend:
    image: ${DOCKER_FRONTEND_IMAGE:-smarteco/crm-frontend:latest}
    container_name: smarteco_crm_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    expose:
      - "3000"

  nginx:
    image: ${DOCKER_NGINX_IMAGE:-smarteco/crm-nginx:latest}
    container_name: smarteco_crm_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:

